name: Aggiorna previsioni marine ARPAS
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/update_arpas.py
      - name: Commit solo se cambiano i dati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/arpas_mare.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna bollettino mare ARPAS'
            git push
          fi
